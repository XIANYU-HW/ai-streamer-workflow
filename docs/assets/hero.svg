    <!-- Bottom rail -->
    <text x="68" y="554" font-size="30" font-weight="650" fill="#f6efdf">7<tspan dx="10" font-size="15" font-weight="500" letter-spacing="2" fill="#aaa5be">ROLES</tspan></text>
    <path d="M239 528v34M429 528v34" stroke="#49435f"/>
    <text x="274" y="554" font-size="30" font-weight="650" fill="#b3f2d9">2<tspan dx="10" font-size="15" font-weight="500" letter-spacing="2" fill="#aaa5be">HOSTS</tspan></text>
    <text x="465" y="554" font-size="30" font-weight="650" fill="#ffba9f">1<tspan dx="10" font-size="15" font-weight="500" letter-spacing="2" fill="#aaa5be">WORKFLOW</tspan></text>
    <text x="1374" y="551" text-anchor="end" font-size="16" fill="#9b95b5">OPEN SOURCE · BUILT TO CONNECT</text>

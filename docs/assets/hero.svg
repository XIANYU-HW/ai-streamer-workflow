      <g fill="#b2f1d8"><circle cx="-229" cy="-72" r="7"/><circle cx="-176" cy="-142" r="4"/><circle cx="164" cy="-150" r="5"/></g>
      <g fill="#ffb59c"><circle cx="227" cy="-44" r="7"/><circle cx="200" cy="79" r="4"/><circle cx="-211" cy="71" r="4"/></g>
      <circle cx="19" cy="-165" r="5" fill="#f4e5bb"/>
      <path d="m192-98 12-19 17 10-12 19Z" fill="#f5e7bf"/>
      <path d="m204-117 5 29M192-98l29-9M209-88q-17 17-6 24t-5 23" fill="none" stroke="#b4a1ca" stroke-width="1.4"/>
      <g fill="#e6d9fa"><path d="m-250 5 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/><path d="m120-180 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/></g>
      <text x="-86" y="-119" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="3" fill="#a7e9d0">HOST A</text>
      <text x="93" y="-116" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="3" fill="#f2b39e">HOST B</text>

      <path d="M-273 66C-322-21-269-130-165-162S50-198 156-169" fill="none" stroke="#b0efdc" stroke-width="1.3" opacity=".72"/>
      <path d="M224-120C298-110 304-38 273 15S259 77 297 92" fill="none" stroke="url(#coral)" stroke-width="14" stroke-linecap="round" opacity=".27"/>
      <path d="M224-120C298-110 304-38 273 15S259 77 297 92" fill="none" stroke="#ffc5ad" stroke-width="1.3" opacity=".72"/>

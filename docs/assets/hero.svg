<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">霓裳 · Nichang — AI Streamer Workflow</title>
  <desc id="desc">An original illustrated broadcast stage with two abstract AI hosts, flowing mint and coral ribbons, orbital lights, and seven crew signals. Developer preview, version 0.1.0. Workflow concept illustration, not a live broadcast screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#222046"/><stop offset="1" stop-color="#101124"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#6250ae" stop-opacity=".43"/><stop offset="1" stop-color="#6250ae" stop-opacity="0"/></radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bbffe5"/><stop offset="1" stop-color="#57c2ba"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc8aa"/><stop offset="1" stop-color="#ef806c"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a6ffe0" stop-opacity=".15"/><stop offset="1" stop-color="#a6ffe0" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a0e9d2"/><stop offset=".5" stop-color="#7f73ae"/><stop offset="1" stop-color="#ffad91"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#9287b8" opacity=".13"/></pattern>
  </defs>
  <rect width="1440" height="600" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="600" rx="24" fill="url(#dots)"/>
  <ellipse cx="1068" cy="295" rx="385" ry="300" fill="url(#halo)"/>
  <g fill="none" stroke="#a296cd" stroke-width="1" opacity=".11"><path d="M744 0v600M1376 0v600"/><path d="M0 496h1440"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
    <!-- Brand signature and release context -->
    <g transform="translate(64 40)">
      <rect width="32" height="32" rx="10" fill="#b3f4db"/>
      <path d="m9 19 8-12-1 10 8-4-9 12 2-9z" fill="#252245"/>
      <text x="46" y="22" font-size="17" font-weight="650" letter-spacing="2.2" fill="#f2eddf">DREAMING BREEZE</text>
    </g>
    <text x="1374" y="61" text-anchor="end" font-size="16" fill="#b9b4d0" letter-spacing="1">v0.1.0 / DEVELOPER PREVIEW</text>

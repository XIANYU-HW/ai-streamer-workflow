    <text x="64" y="208" font-size="112" font-weight="650" letter-spacing="12" fill="#f7f2e5">霓裳</text>
    <text x="68" y="285" font-size="62" font-weight="700" letter-spacing="5" fill="#b4f5dc">NICHANG</text>
    <text x="71" y="325" font-size="20" font-weight="550" letter-spacing="2.8" fill="#c7c0da">AI STREAMER WORKFLOW</text>
    <path d="M71 356h42" stroke="#ffac91" stroke-width="3" stroke-linecap="round"/>
    <text x="71" y="398" font-size="29" font-weight="450" letter-spacing="-.5" fill="#f7f2e5">Your AI broadcast crew.</text>
    <text x="71" y="434" font-size="18" fill="#9f99b8">Seven roles. Two hosts. A shared direction.</text>

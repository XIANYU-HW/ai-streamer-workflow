        <path d="M-52 68q0-40 24-47h56q24 7 24 47l-9 28q-43 17-86 0Z" fill="url(#mint)"/>
        <path d="M-34 50q34 12 68 0v37q-34 12-68 0Z" fill="#52b0a8" opacity=".65"/>
        <rect x="-63" y="-69" width="126" height="105" rx="41" fill="url(#mint)"/>
        <rect x="-52" y="-55" width="104" height="67" rx="30" fill="#17223a"/>
        <path d="M-31-20q8-15 16 0M14-20q8-15 16 0" fill="none" stroke="#baffdf" stroke-width="5" stroke-linecap="round"/>

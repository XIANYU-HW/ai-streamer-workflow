<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色工作室 · 迁移资料</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="desktop.css"></head><body><main class="welcome"><span class="welcome-brand">CHARACTER STUDIO · DESKTOP 0.4.0</span><h1>把你的舞台带进工作室</h1><p>角色、场景、场次与记忆一起保留。桌面版使用独立资料库，原网页中的资料不会被删除或改写。</p><div class="actions"><button id="importExisting" class="primary">导入现有完整备份</button><button id="startFresh">建立新的工作室</button></div><output id="welcomeStatus" role="status">正在检查资料…</output><div class="note"><p>迁移方法：在旧版工作室点击「导出备份」，再在这里选择得到的 JSON 文件。Windows 上也使用同样的方法。</p><p>资料保存在本机软件目录；切换电脑时可用「导出完整备份／导入资料」。自动备份不会自动同步两台电脑。</p><button id="recoverWorkspace" class="ghost">从自动备份恢复</button><button id="showData" class="ghost">打开资料文件夹</button><p class="muted">最小化窗口可继续演练。退出软件会停止声音和动作；重新打开不会自动播放。</p></div></main><script src="welcome.js"></script></body></html>
